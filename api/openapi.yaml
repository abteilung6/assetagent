openapi: 3.0.3
info:
  title: assetagent API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/transactions:
    get:
      operationId: getTransactions
      summary: List transactions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: from
          in: query
          description: Booking date lower bound (inclusive), YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Booking date upper bound (inclusive), YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: account
          in: query
          description: Filter by order account (exact match)
          schema:
            type: string
        - name: counterparty
          in: query
          description: Filter by counterparty name prefix
          schema:
            type: string
        - name: min_amount
          in: query
          description: Minimum amount (inclusive)
          schema:
            type: string
        - name: max_amount
          in: query
          description: Maximum amount (inclusive)
          schema:
            type: string
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum: [booking_date, amount, counterparty]
            default: booking_date
        - name: order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: q
          in: query
          description: Search purpose, counterparty, and booking text
          schema:
            type: string
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat:
    post:
      operationId: postChat
      summary: Send a chat message and receive a grounded finance answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant answer with optional tool call trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat/stream:
    post:
      operationId: postChatStream
      summary: Stream a grounded finance answer as server-sent events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: |
            SSE stream. Events: delta, tool_start, tool_result, done, error.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/llm/models:
    get:
      operationId: getLLMModels
      summary: List available LLM models for chat
      responses:
        "200":
          description: Model catalog for the chat composer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMModelCatalog"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports/preview:
    post:
      operationId: postImportsPreview
      summary: Preview a Sparkasse CSV import without writing transactions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Sparkasse CSV export
      responses:
        "200":
          description: Import preview with stats, samples, and validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Invalid request or unreadable CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports:
    get:
      operationId: getImports
      summary: List recent import runs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent import runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: postImports
      summary: Commit a Sparkasse CSV import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Sparkasse CSV export
                account_name:
                  type: string
                  description: Display name for a new or matched account
                account_id:
                  type: string
                  format: uuid
                  description: Existing account to attach the import run to
                preview_hash:
                  type: string
                  description: Optional SHA-256 from preview; must match the uploaded file
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommitResponse"
        "400":
          description: Invalid request, unreadable CSV, or preview hash mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports/{id}:
    get:
      operationId: getImport
      summary: Get an import run by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "404":
          description: Import run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports/{id}/rollback:
    post:
      operationId: postImportRollback
      summary: Roll back a committed import run and delete its transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import run rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRollbackResponse"
        "404":
          description: Import run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Import run already rolled back or not committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/transfers/candidates:
    get:
      operationId: getTransferCandidates
      summary: List suggested internal transfer pairs awaiting review
      responses:
        "200":
          description: Suggested transfer candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCandidateListResponse"
  /api/transfers/{id}/confirm:
    post:
      operationId: postTransferConfirm
      summary: Confirm a suggested transfer pair (exclude legs from household cashflow)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer pair confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPair"
        "404":
          description: Transfer pair not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transfer pair is not in suggested status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/transfers/{id}/reject:
    post:
      operationId: postTransferReject
      summary: Reject a suggested transfer pair
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer pair rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPair"
        "404":
          description: Transfer pair not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transfer pair is not in suggested status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64
    Transaction:
      type: object
      required:
        - id
        - order_account
        - booking_date
        - value_date
        - booking_text
        - purpose
        - creditor_id
        - mandate_reference
        - end_to_end_reference
        - collection_reference
        - direct_debit_original_amount
        - chargeback_expense_reimbursement
        - counterparty
        - amount
        - currency
        - info
      properties:
        id:
          type: string
          format: uuid
        order_account:
          type: string
        booking_date:
          type: string
          format: date
        value_date:
          type: string
          format: date
        booking_text:
          type: string
        purpose:
          type: string
        creditor_id:
          type: string
        mandate_reference:
          type: string
        end_to_end_reference:
          type: string
        collection_reference:
          type: string
        direct_debit_original_amount:
          type: string
        chargeback_expense_reimbursement:
          type: string
        counterparty:
          type: string
        counterparty_iban:
          type: string
          nullable: true
        counterparty_bic:
          type: string
          nullable: true
        amount:
          type: string
        currency:
          type: string
        info:
          type: string
    TransactionListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ChatRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        provider:
          type: string
          enum: [ollama, openrouter]
          description: Optional LLM provider override
        model:
          type: string
          description: Optional model override for the selected provider
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
    ChatResponse:
      type: object
      required:
        - answer
        - tool_calls
      properties:
        answer:
          type: string
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ChatToolCall"
    ChatToolCall:
      type: object
      required:
        - name
        - input
        - result
      properties:
        name:
          type: string
        input:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
    LLMModelSelection:
      type: object
      required:
        - provider
        - model
      properties:
        provider:
          type: string
          enum: [ollama, openrouter]
        model:
          type: string
    LLMModelOption:
      type: object
      required:
        - provider
        - model
        - label
      properties:
        provider:
          type: string
          enum: [ollama, openrouter]
        model:
          type: string
        label:
          type: string
        group:
          type: string
          description: Optional UI group, e.g. Cloud or Local
    LLMModelCatalog:
      type: object
      required:
        - default
        - options
      properties:
        default:
          $ref: "#/components/schemas/LLMModelSelection"
        options:
          type: array
          items:
            $ref: "#/components/schemas/LLMModelOption"
    ImportPreviewPeriod:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    ImportPreviewSampleRow:
      type: object
      required:
        - line
        - booking_date
        - counterparty
        - purpose
        - amount
        - currency
      properties:
        line:
          type: integer
        booking_date:
          type: string
          format: date
        counterparty:
          type: string
        purpose:
          type: string
        amount:
          type: string
        currency:
          type: string
    ImportPreviewInvalidRow:
      type: object
      required:
        - line
        - message
      properties:
        line:
          type: integer
        field:
          type: string
        message:
          type: string
    ImportPreviewResponse:
      type: object
      required:
        - file_hash
        - source_filename
        - parser_name
        - parser_version
        - suggested_account
        - row_total
        - row_valid
        - row_invalid
        - sample_rows
        - invalid_rows
        - warnings
      properties:
        file_hash:
          type: string
        source_filename:
          type: string
        parser_name:
          type: string
        parser_version:
          type: string
        period:
          $ref: "#/components/schemas/ImportPreviewPeriod"
          nullable: true
        suggested_account:
          type: string
        row_total:
          type: integer
        row_valid:
          type: integer
        row_invalid:
          type: integer
        sample_rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewSampleRow"
        invalid_rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewInvalidRow"
        warnings:
          type: array
          items:
            type: string
    ImportCommitResponse:
      type: object
      required:
        - import_run_id
        - account_id
        - account_name
        - rows
        - inserted
        - duplicates
      properties:
        import_run_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        rows:
          type: integer
        inserted:
          type: integer
        duplicates:
          type: integer
    ImportRun:
      type: object
      required:
        - id
        - account_id
        - source_filename
        - status
        - row_total
        - row_valid
        - row_inserted
        - row_duplicate
        - created_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        source_filename:
          type: string
        status:
          type: string
          enum: [committed, rolled_back, failed]
        row_total:
          type: integer
        row_valid:
          type: integer
        row_inserted:
          type: integer
        row_duplicate:
          type: integer
        created_at:
          type: string
          format: date-time
        committed_at:
          type: string
          format: date-time
          nullable: true
        rolled_back_at:
          type: string
          format: date-time
          nullable: true
    ImportRunListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImportRun"
    ImportRollbackResponse:
      type: object
      required:
        - import_run_id
        - deleted
        - source_filename
      properties:
        import_run_id:
          type: string
          format: uuid
        deleted:
          type: integer
          format: int64
        source_filename:
          type: string
    TransferLeg:
      type: object
      required:
        - transaction_id
        - account_name
        - booking_date
        - amount
        - booking_text
        - purpose
        - counterparty
      properties:
        transaction_id:
          type: string
          format: uuid
        account_name:
          type: string
        booking_date:
          type: string
          format: date
        amount:
          type: string
        booking_text:
          type: string
        purpose:
          type: string
        counterparty:
          type: string
    TransferCandidate:
      type: object
      required:
        - id
        - status
        - confidence
        - amount
        - out
        - in
        - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [suggested, confirmed, rejected]
        confidence:
          type: string
          enum: [exact, probable]
        amount:
          type: string
          description: Absolute transfer amount in EUR
        out:
          $ref: "#/components/schemas/TransferLeg"
        in:
          $ref: "#/components/schemas/TransferLeg"
        created_at:
          type: string
          format: date-time
    TransferCandidateListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TransferCandidate"
    TransferPair:
      type: object
      required:
        - id
        - tx_out_id
        - tx_in_id
        - status
        - confidence
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tx_out_id:
          type: string
          format: uuid
        tx_in_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [suggested, confirmed, rejected]
        confidence:
          type: string
          enum: [exact, probable]
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
