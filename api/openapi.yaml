openapi: 3.0.3
info:
  title: assetagent API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/transactions:
    get:
      operationId: getTransactions
      summary: List transactions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: from
          in: query
          description: Booking date lower bound (inclusive), YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Booking date upper bound (inclusive), YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: account
          in: query
          description: Filter by order account (exact match)
          schema:
            type: string
        - name: counterparty
          in: query
          description: Filter by counterparty name prefix
          schema:
            type: string
        - name: min_amount
          in: query
          description: Minimum amount (inclusive)
          schema:
            type: string
        - name: max_amount
          in: query
          description: Maximum amount (inclusive)
          schema:
            type: string
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum: [booking_date, amount, counterparty]
            default: booking_date
        - name: order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: q
          in: query
          description: Search purpose, counterparty, and booking text
          schema:
            type: string
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat:
    post:
      operationId: postChat
      summary: Send a chat message and receive a grounded finance answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant answer with optional tool call trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat/stream:
    post:
      operationId: postChatStream
      summary: Stream a grounded finance answer as server-sent events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: |
            SSE stream. Events: delta, tool_start, tool_result, done, error.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/llm/models:
    get:
      operationId: getLLMModels
      summary: List available LLM models for chat
      responses:
        "200":
          description: Model catalog for the chat composer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMModelCatalog"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports/preview:
    post:
      operationId: postImportsPreview
      summary: Preview a Sparkasse CSV import without writing transactions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Sparkasse CSV export
      responses:
        "200":
          description: Import preview with stats, samples, and validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Invalid request or unreadable CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports:
    get:
      operationId: getImports
      summary: List recent import runs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent import runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunListResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: postImports
      summary: Commit a Sparkasse CSV import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Sparkasse CSV export
                account_name:
                  type: string
                  description: Display name for a new or matched account
                account_id:
                  type: string
                  format: uuid
                  description: Existing account to attach the import run to
                preview_hash:
                  type: string
                  description: Optional SHA-256 from preview; must match the uploaded file
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommitResponse"
        "400":
          description: Invalid request, unreadable CSV, or preview hash mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports/{id}:
    get:
      operationId: getImport
      summary: Get an import run by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "404":
          description: Import run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/imports/{id}/rollback:
    post:
      operationId: postImportRollback
      summary: Roll back a committed import run and delete its transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import run rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRollbackResponse"
        "404":
          description: Import run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Import run already rolled back or not committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/transfers/candidates:
    get:
      operationId: getTransferCandidates
      summary: List suggested internal transfer pairs awaiting review
      responses:
        "200":
          description: Suggested transfer candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCandidateListResponse"
  /api/transfers/{id}/confirm:
    post:
      operationId: postTransferConfirm
      summary: Confirm a suggested transfer pair (exclude legs from household cashflow)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer pair confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPair"
        "404":
          description: Transfer pair not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transfer pair is not in suggested status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/transfers/{id}/reject:
    post:
      operationId: postTransferReject
      summary: Reject a suggested transfer pair
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer pair rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPair"
        "404":
          description: Transfer pair not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transfer pair is not in suggested status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/recurring/uncertain:
    get:
      operationId: getUncertainRecurring
      summary: List uncertain recurring series awaiting review
      responses:
        "200":
          description: Uncertain recurring series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSeriesListResponse"
  /api/recurring/{id}/confirm:
    post:
      operationId: postRecurringConfirm
      summary: Confirm an uncertain recurring series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recurring series confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSeries"
        "404":
          description: Recurring series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Recurring series is not uncertain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/recurring/{id}/reject:
    post:
      operationId: postRecurringReject
      summary: Dismiss an uncertain recurring series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recurring series dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSeries"
        "404":
          description: Recurring series not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Recurring series is not uncertain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/categories:
    get:
      operationId: getCategories
      summary: List system (and user) categories
      responses:
        "200":
          description: Category taxonomy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /api/classifications/queue:
    get:
      operationId: getClassificationQueue
      summary: List high-impact classifications awaiting review
      responses:
        "200":
          description: Classification queue items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationQueueListResponse"
  /api/classifications/{transaction_id}/correct:
    post:
      operationId: postClassificationCorrect
      summary: Correct a transaction category and optionally save a merchant rule
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationCorrectRequest"
      responses:
        "200":
          description: Classification corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationCorrectResponse"
        "400":
          description: Invalid category or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/baselines/current:
    get:
      operationId: getCurrentBaseline
      summary: Get the current draft or confirmed FinancialBaseline
      responses:
        "200":
          description: Current baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialBaseline"
        "404":
          description: No baseline available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/baselines/recompute:
    post:
      operationId: postBaselinesRecompute
      summary: Recompute and persist a draft FinancialBaseline
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaselineRecomputeRequest"
      responses:
        "200":
          description: Draft baseline created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialBaseline"
        "400":
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/baselines/{id}/confirm:
    post:
      operationId: postBaselineConfirm
      summary: Confirm a draft FinancialBaseline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Baseline confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialBaseline"
        "404":
          description: Baseline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Baseline is not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/baselines/{id}/adjust:
    post:
      operationId: postBaselineAdjust
      summary: Correct one baseline metric and create a new draft version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaselineAdjustRequest"
      responses:
        "200":
          description: Adjusted draft baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialBaseline"
        "400":
          description: Invalid adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Baseline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Baseline cannot be adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/reviews:
    get:
      operationId: getMoneyReviews
      summary: List Money Reviews (newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Money Review history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyReviewListResponse"
    post:
      operationId: postMoneyReviews
      summary: Generate a Money Review pinned to the current (or given) baseline
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyReviewCreateRequest"
      responses:
        "200":
          description: Money Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyReview"
        "400":
          description: Baseline missing or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Baseline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/reviews/{id}:
    get:
      operationId: getMoneyReview
      summary: Get a Money Review by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Money Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyReview"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/reviews/{id}/confirm:
    post:
      operationId: postMoneyReviewConfirm
      summary: Confirm a Money Review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyReview"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Review cannot be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forecasts:
    post:
      operationId: postForecasts
      summary: Create a 90-day liquidity forecast from the current baseline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastCreateRequest"
      responses:
        "200":
          description: Forecast created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"
        "400":
          description: Invalid request or missing baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Baseline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forecasts/latest:
    get:
      operationId: getLatestForecast
      summary: Get the latest forecast for the current baseline
      responses:
        "200":
          description: Latest forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"
        "404":
          description: No forecast available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forecasts/{id}:
    get:
      operationId: getForecast
      summary: Get a forecast by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"
        "404":
          description: Forecast not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forecasts/{id}/scenarios:
    get:
      operationId: getForecastScenarios
      summary: List scenarios for a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioListResponse"
    post:
      operationId: postForecastScenario
      summary: Run a typed scenario against a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioCreateRequest"
      responses:
        "200":
          description: Scenario result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: Invalid scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forecast not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/decisions:
    get:
      operationId: getDecisions
      summary: List decisions (newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Decision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionListResponse"
    post:
      operationId: postDecisions
      summary: Create a decision with one measurable action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionCreateRequest"
      responses:
        "200":
          description: Decision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Review or scenario not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/actions:
    get:
      operationId: getActions
      summary: List actions (optionally by status)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [planned, done, skipped, irrelevant]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionListResponse"
  /api/actions/{id}/status:
    post:
      operationId: postActionStatus
      summary: Update an action status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionStatusRequest"
      responses:
        "200":
          description: Action updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64
    Transaction:
      type: object
      required:
        - id
        - order_account
        - booking_date
        - value_date
        - booking_text
        - purpose
        - creditor_id
        - mandate_reference
        - end_to_end_reference
        - collection_reference
        - direct_debit_original_amount
        - chargeback_expense_reimbursement
        - counterparty
        - amount
        - currency
        - info
      properties:
        id:
          type: string
          format: uuid
        order_account:
          type: string
        booking_date:
          type: string
          format: date
        value_date:
          type: string
          format: date
        booking_text:
          type: string
        purpose:
          type: string
        creditor_id:
          type: string
        mandate_reference:
          type: string
        end_to_end_reference:
          type: string
        collection_reference:
          type: string
        direct_debit_original_amount:
          type: string
        chargeback_expense_reimbursement:
          type: string
        counterparty:
          type: string
        counterparty_iban:
          type: string
          nullable: true
        counterparty_bic:
          type: string
          nullable: true
        amount:
          type: string
        currency:
          type: string
        info:
          type: string
    TransactionListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ChatRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        provider:
          type: string
          enum: [ollama, openrouter]
          description: Optional LLM provider override
        model:
          type: string
          description: Optional model override for the selected provider
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
