services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: assetagent
      POSTGRES_PASSWORD: assetagent
      POSTGRES_DB: assetagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetagent -d assetagent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
