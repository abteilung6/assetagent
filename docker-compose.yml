services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: assetagent
      POSTGRES_PASSWORD: assetagent
      POSTGRES_DB: assetagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetagent -d assetagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
